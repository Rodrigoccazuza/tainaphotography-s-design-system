name: Fix Taina Camera Icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-camera-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore camera glyphs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          white_camera = '''<span class="disc camera"><svg class="camera-svg" aria-hidden="true" viewBox="0 0 64 48"><path d="M9 11h10l4-7h18l4 7h10c4 0 7 3 7 7v23c0 4-3 7-7 7H9c-4 0-7-3-7-7V18c0-4 3-7 7-7Z" fill="currentColor"/><circle cx="32" cy="29" r="12" fill="var(--camera-bg)"/><circle cx="32" cy="29" r="8" fill="currentColor"/><circle cx="52" cy="19" r="3" fill="var(--camera-bg)"/></svg></span>'''
          dark_camera = '''<span class="disc camera darkcam"><svg class="camera-svg" aria-hidden="true" viewBox="0 0 64 48"><path d="M9 11h10l4-7h18l4 7h10c4 0 7 3 7 7v23c0 4-3 7-7 7H9c-4 0-7-3-7-7V18c0-4 3-7 7-7Z" fill="currentColor"/><circle cx="32" cy="29" r="12" fill="var(--camera-bg)"/><circle cx="32" cy="29" r="8" fill="currentColor"/><circle cx="52" cy="19" r="3" fill="var(--camera-bg)"/></svg></span>'''
          side_camera = '''<span class="side-disc cam"><svg class="camera-svg" aria-hidden="true" viewBox="0 0 64 48"><path d="M9 11h10l4-7h18l4 7h10c4 0 7 3 7 7v23c0 4-3 7-7 7H9c-4 0-7-3-7-7V18c0-4 3-7 7-7Z" fill="currentColor"/><circle cx="32" cy="29" r="12" fill="#fff"/><circle cx="32" cy="29" r="8" fill="#000"/><circle cx="52" cy="19" r="3" fill="#fff"/></svg></span>'''

          text = text.replace('<span class="disc camera">●</span>', white_camera)
          text = text.replace('<span class="disc camera darkcam">●</span>', dark_camera)
          text = text.replace('<span class="side-disc cam">●</span>', side_camera)

          # Make the camera foreground/background explicit for both logo surface variants.
          text = text.replace('.disc.camera{background:#fff;color:#000}', '.disc.camera{background:#fff;color:#000;--camera-bg:#fff}')
          text = text.replace('.disc.camera.darkcam{background:#000;color:#fff}', '.disc.camera.darkcam{background:#000;color:#fff;--camera-bg:#000}')
          text = text.replace('.camera-svg{width:64%;height:auto}', '.camera-svg{width:68%;height:auto;display:block}')
          text = text.replace('.side-disc.cam{background:#fff;color:#000;font-size:9px}', '.side-disc.cam{background:#fff;color:#000;font-size:9px}.side-disc.cam .camera-svg{width:68%;height:auto}')

          path.write_text(text)
          PY
      - name: Commit camera fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore camera icons in brand logo lockups"
          git push origin main
